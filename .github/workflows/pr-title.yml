name: pr-title
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Pull request whose current title is validated
        required: true
        type: string
      expected_sha:
        description: Exact pull request head commit
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The standalone title check must not evaluate the entire fleet flake.
      # Keep this at the same Convco version as the local convco-ci hook.
      - name: Validate the squash commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$GITHUB_SHA" = "$EXPECTED_SHA"
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json title,headRefOid,state > "$RUNNER_TEMP/pr-title.json"
            test "$(jq -r .headRefOid "$RUNNER_TEMP/pr-title.json")" = "$EXPECTED_SHA"
            test "$(jq -r .state "$RUNNER_TEMP/pr-title.json")" = OPEN
            PR_TITLE=$(jq -r .title "$RUNNER_TEMP/pr-title.json")
          fi
          # The lock updater's subject is also exempt in the local commit hook.
          if test "$PR_TITLE" = 'flake.lock: Update'; then
            exit 0
          fi
          set -euo pipefail
          archive="$RUNNER_TEMP/convco.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/convco/convco/releases/download/v0.7.2/convco-x86_64-unknown-linux-musl.tar.gz' \
            --output "$archive"
          # Digest from the GitHub v0.7.2 release asset, not the PR.
          printf '%s  %s\n' 'f9cfad24af372018f4b8d430cf86d1b7b9b36fcb7e1db5dd30c54b2eed7dde75' "$archive" \
            | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/convco"
          tar -xzf "$archive" -C "$RUNNER_TEMP/convco" --strip-components=1 \
            'convco-x86_64-unknown-linux-musl/convco'
          chmod +x "$RUNNER_TEMP/convco/convco"
          printf '%s\n' "$PR_TITLE" | "$RUNNER_TEMP/convco/convco" check --from-stdin
