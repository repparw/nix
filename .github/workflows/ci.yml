# The repo gate (flake check) already evals every host's toplevel plus the
# 500-line rendered-fleet asserts; this workflow is that gate, run on push
# instead of only when a session remembers to run it locally.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      # The host-facts flake input is a machine-local path that does not
      # exist on runners. Materialize it with harmless null defaults so
      # evaluation succeeds; every consumer treats null as "omit". The lock
      # pin must be refreshed afterwards: path inputs are pinned by content
      # hash, and evaluation uses the pinned copy, not the live directory.
      - run: >
          sudo mkdir -p /home/repparw/.config/nix/private-facts &&
          echo '{ wanIp = null; bluetoothDevice = null; }'
          | sudo tee /home/repparw/.config/nix/private-facts/facts.nix > /dev/null &&
          sudo chmod -R a+rX /home/repparw/.config/nix/private-facts &&
          nix flake lock --update-input host-facts
      # Not `nix flake check`: it verifies every nixosConfigurations toplevel,
      # and epsilon's pulls the hermes-agent flake (uv2nix/pyproject sources)
      # into eval — most of the gate's wall time, and hermes is tested
      # upstream. Build the check derivations explicitly instead: they cover
      # the fleet asserts (service-definitions evals epsilon's edge config
      # without forcing hermes) plus alpha/pi toplevel evals. Epsilon's
      # toplevel is exercised by pi's auto-update probes and local dev.
      - run: >
          nix build
          .#checks.x86_64-linux.formatting
          .#checks.x86_64-linux.shellcheck
          .#checks.x86_64-linux.sops-files
          .#checks.x86_64-linux.change-detection
          .#checks.x86_64-linux.check-flake-file
          .#checks.x86_64-linux.deploy-schema
          .#checks.x86_64-linux.service-definitions
          .#checks.x86_64-linux.alpha
          .#checks.x86_64-linux.pi
          --print-build-logs --keep-going
