# The repo gate (flake check) already evals every host's toplevel plus the
# 500-line rendered-fleet asserts; this workflow is that gate, run on push
# instead of only when a session remembers to run it locally.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      # Plain check: --no-build breaks IFD during eval (stylix base16-schemes,
      # app checks -> "path is not valid"). Host toplevels are eval-only here
      # anyway; check derivations are small. The 20m job timeout covers the
      # slow first-fetch of hermes-agent's flake inputs during epsilon eval.
      - run: nix flake check --print-build-logs --keep-going
