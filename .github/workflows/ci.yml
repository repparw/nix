name: ci
# Dispatches retain their exact validation manifest in display_title because
# lock-update/Hermes recovery match that string. Ordinary PR/push runs instead
# get compact titles for the Actions UI.
run-name: >-
  ${{ github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || (github.event_name == 'push' && 'main push' || format('validate sha={0} watchers={1}{2}', inputs.expected_sha || 'none', inputs.upstream_watcher || 'none', inputs.hermes_update && ' hermes=true' || '')) }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit expected at the dispatched ref
        required: true
        type: string
      upstream_watcher:
        description: Independent cleanup requiring package validation
        required: false
        type: string
      hermes_update:
        description: Validate the pinned Hermes messaging runtime on native ARM
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Exact SHA does not identify all required checks: isolate the manifests.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('{0}-{1}-{2}-{3}', github.sha, inputs.expected_sha, inputs.upstream_watcher || 'none', inputs.hermes_update) || github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    uses: ./.github/workflows/revision-validation.yml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
      upstream_watcher: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_watcher || (github.event_name == 'pull_request' && ((startsWith(github.head_ref, 'automation/upstream-') && github.head_ref) || (github.head_ref == 'automation/atomic-cleanup' && 'automation/atomic-cleanup'))) || '' }}
      hermes_update: ${{ (github.event_name == 'workflow_dispatch' && inputs.hermes_update) || (github.event_name == 'pull_request' && github.head_ref == 'automation/hermes-stable') }}
