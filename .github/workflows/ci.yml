# The repo gate (flake check) already evals every host's toplevel plus the
# 500-line rendered-fleet asserts; this workflow is that gate, run on push
# instead of only when a session remembers to run it locally.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # hermes-agent (uv2nix) is already built/tested upstream (NousResearch/hermes-agent CI + Cachix);
      # skip building its closure here — eval the fleet gate without it.
      - run: nix flake check --no-build --print-build-logs --keep-going
      - run: nix build .#checks.x86_64-linux.service-definitions --print-build-logs
      - run: nix build .#checks.x86_64-linux.shellcheck .#checks.x86_64-linux.formatting --print-build-logs
