name: ci
# GitHub exposes this as workflow_runs[].display_title. Recovery verifies
# the exact requested package validations before reusing an existing run.
run-name: >-
  validate sha=${{ inputs.expected_sha || 'none' }} watchers=${{ inputs.upstream_watcher || 'none' }} arm=${{ inputs.build_arm_authelia && 'true' || 'false' }}
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit expected at the dispatched ref
        required: true
        type: string
      build_arm_authelia:
        description: Build the unpatched aarch64 Authelia package natively
        required: false
        type: boolean
        default: false
      upstream_watcher:
        description: Independent cleanup requiring package validation
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, inputs.expected_sha) || github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    uses: ./.github/workflows/revision-validation.yml
    with:
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
      build_arm_authelia: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_arm_authelia) || (github.event_name == 'pull_request' && github.head_ref == 'automation/atomic-cleanup') }}
      upstream_watcher: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_watcher || (github.event_name == 'pull_request' && ((startsWith(github.head_ref, 'automation/upstream-') && github.head_ref) || (github.head_ref == 'automation/atomic-cleanup' && 'automation/atomic-cleanup'))) || '' }}
