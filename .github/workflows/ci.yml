name: ci
on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - flake.lock
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit expected at the dispatched ref
        required: true
        type: string
      build_arm_authelia:
        description: Build the unpatched aarch64 Authelia package natively
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && format('{0}-{1}', github.sha, inputs.expected_sha) || github.run_id) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  validate:
    uses: ./.github/workflows/revision-validation.yml
    with:
      expected_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha || '' }}
      build_arm_authelia: ${{ github.event_name == 'workflow_dispatch' && inputs.build_arm_authelia || false }}

  # Disposable forced probe; only exists on the unmerged test branch.
  # Exercise the original aarch64 packaging failure with the upstream fix
  # without changing the fleet's production flake.lock or claiming the
  # nixos-unstable rollout has completed.
  forced-authelia-arm-probe:
    name: fixed-upstream Authelia (native ARM, isolated probe)
    if: github.event_name == 'pull_request' && github.head_ref == 'test/authelia-upstream-arm-20261011'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v22
      - name: Build unpatched aarch64 Authelia using the upstream fix commit
        run: >
          nix build --no-link --print-out-paths
          --override-input nixpkgs github:NixOS/nixpkgs/6b157b9637b15f44d1f07065cdfd681166014455
          ".#nixosConfigurations.epsilon.pkgs.authelia"
