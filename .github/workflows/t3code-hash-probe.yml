name: t3code hash probe (temporary)
on:
  push:
    branches:
      - codex/t3code-013-watchers
permissions:
  contents: read
jobs:
  hashes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Probe updated Nixpkgs and pnpm hash
        shell: bash
        run: |
          set -euo pipefail
          nix flake update nixpkgs
          python3 - <<'PY'
          import json
          with open("flake.lock") as f:
              locked = json.load(f)["nodes"]["nixpkgs"]["locked"]
          print("T3CODE_NIXPKGS_LOCKED_JSON=" + json.dumps(locked, sort_keys=True), flush=True)
          PY
          nix build --no-link --show-trace -L .#nixosConfigurations.alpha.config.home-manager.users.repparw.programs.t3code.package
