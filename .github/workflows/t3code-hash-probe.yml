name: t3code pnpm-v4 compatibility probe (temporary)
on:
  push:
    branches:
      - codex/t3code-013-watchers
permissions:
  contents: read
jobs:
  hash:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Verify pnpm 12 / fetcher 4 on current root pin
        run: |
          set -euo pipefail
          nix build --no-link --show-trace -L .#nixosConfigurations.alpha.pkgs.t3code
