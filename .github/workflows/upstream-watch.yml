name: upstream-watch
on:
  push:
    branches: [main]
    paths:
      - flake.lock

  workflow_run:
    workflows: [lock-update]
    types: [completed]

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Watch upstream and prepare cleanup candidates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: bash .github/scripts/upstream-watch.sh
