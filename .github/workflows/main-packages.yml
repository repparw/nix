name: main-packages
on:
  push:
    branches: [main]
    paths:
      - 'modules/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/main-packages.yml'
      - '.github/scripts/publish-main-packages.sh'
  # Actions using GITHUB_TOKEN to fast-forward main do not produce push workflows.
  # Trigger after lock-update instead, only if main advanced during that run.
  workflow_run:
    workflows: [lock-update]
    types: [completed]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit to validate at the selected ref
        required: true
        type: string

permissions:
  contents: read

# Serialize each architecture so later revisions can reuse earlier uploads.
concurrency:
  group: main-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha != github.sha)
    name: packages (${{ matrix.system }}, native)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
            build_cores: 2
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            build_cores: 1
    steps:
      - name: Verify requested revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require upload token
        env:
          TOKEN_PRESENT: ${{ secrets.CACHIX_AUTH_TOKEN != '' }}
        run: test "$TOKEN_PRESENT" = true
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: true
      - name: Build missing packages
        env:
          SYSTEM: ${{ matrix.system }}
          BUILD_CORES: ${{ matrix.build_cores }}
        run: |
          mkdir -p ci-logs
          nix run .#nix-fast-build --no-update-lock-file -- \
            --flake ".#ciPackages.$SYSTEM" --systems "$SYSTEM" \
            --skip-cached \
            --out-link "$RUNNER_TEMP/main-package-result" \
            --eval-workers 1 --eval-max-memory-size 8192 \
            --max-jobs 1 --option cores "$BUILD_CORES" \
            --result-file ci-logs/packages.json
          test -s ci-logs/packages.json
      - name: Publish successful package outputs
        if: (success() || failure()) && hashFiles('ci-logs/packages.json') != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: bash .github/scripts/publish-main-packages.sh
      # Report residual cache misses from the actual NixOS dependency graphs.
      # This never realizes or publishes system/activation closures.
      - name: Audit remaining host closure builds
        if: (success() || failure()) && hashFiles('ci-logs/packages.json') != ''
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          case "$SYSTEM" in
            x86_64-linux) hosts=(alpha) ;;
            aarch64-linux) hosts=(pi epsilon) ;;
            *) exit 1 ;;
          esac
          for host in "${hosts[@]}"; do
            log="ci-logs/cache-preflight-$host.txt"
            echo "Checking remaining NixOS build requirements for $host"
            if ! nix build --dry-run --no-link --no-update-lock-file \
              ".#nixosConfigurations.$host.config.system.build.toplevel" >"$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            cat "$log"
          done
      - name: Upload build results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: main-packages-${{ matrix.system }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
