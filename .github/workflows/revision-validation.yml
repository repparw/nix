# Host checks evaluate configurations with package stubs, not native closures.
name: revision-validation
on:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        required: false
    inputs:
      expected_sha:
        description: Exact commit expected for this validation
        required: false
        type: string
      upstream_watcher:
        required: false
        type: string
      hermes_update:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      check_matrix: ${{ steps.impact.outputs.check_matrix }}
      run_hosts: ${{ steps.impact.outputs.run_hosts }}
      run_persistence_vm: ${{ steps.impact.outputs.run_persistence_vm }}
    steps:
      - name: Verify requested revision
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: Detect affected validation
        id: impact
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-impact.mjs

  checks:
    needs: changes
    name: checks (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.check_matrix) }}
    steps:
      - name: Verify requested revision
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # The daemon publishes locally built paths as they finish; substituted
      # paths never reach the post-build hook and Cachix skips paths that
      # cache.nixos.org already serves.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          useDaemon: true
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run attributed checks
        env:
          CI_CHECKS: ${{ matrix.checks }}
        run: bash .github/scripts/run-checks.sh
      - name: Test upstream watcher predicates and publication lifecycle
        if: matrix.group == 'lightweight'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 .github/scripts/upstream-readiness.test.py
          python3 .github/scripts/upstream-plan.test.py
          python3 modules/aspects/services/free-games-claimer/claim-diff.test.py
          python3 modules/aspects/services/free-games-claimer/notify.test.py
          python3 modules/aspects/services/free-games-claimer/claim.test.py
          # Evaluate fleet attributes and build compatible/incompatible patch
          # fixtures through the production probe, including version-check hooks.
          NIX_PROBE_SMOKE=1 python3 .github/scripts/upstream-plan.test.py \
            -k test_real_nix
          python3 .github/scripts/upstream-publish.test.py
          python3 .github/scripts/upstream-release-readiness.test.py
          # Exercise recovery fixtures before the longer fleet-cli derivation.
          # This also catches malformed Python mock strings early.
          python3 modules/scripts/lock-update.test.py \
            .github/workflows/lock-update.yml \
            .github/workflows/ci.yml \
            .github/workflows/revision-validation.yml
          python3 .github/scripts/hermes-update.test.py
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.group }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  host-eval:
    needs: changes
    if: needs.changes.outputs.run_hosts == 'true'
    name: host-eval (fleet, stubbed)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify requested revision
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Evaluate all hosts with stubs
        env:
          CI_CHECKS: alpha pi epsilon
        run: bash .github/scripts/run-checks.sh
      - name: Compare Den migration semantics with pre-cutover main
        env:
          DEN_BASE_REV: 516e6b1cbe39ddab01dc356c8c8a8c3ef1f24641
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$DEN_BASE_REV"
          before="$RUNNER_TEMP/den-before"
          git worktree add --detach "$before" "$DEN_BASE_REV"
          snapshot=$(cat <<'NIX'
          let
            f = builtins.getFlake (builtins.getEnv "FLEET_SNAPSHOT_ROOT");
            lib = f.inputs.nixpkgs.lib;
            sortedPackages = list: lib.sort lib.lessThan (map lib.getName list);
            hostSnapshot = host:
              let
                cfg = f.nixosConfigurations.${host}.config;
                hm = cfg.home-manager.users.repparw;
              in
              {
                userId = cfg.users.users.repparw.uid;
                userGroups = lib.sort lib.lessThan cfg.users.users.repparw.extraGroups;
                systemPackages = sortedPackages cfg.environment.systemPackages;
                homePackages = sortedPackages hm.home.packages;
                systemdServices = builtins.attrNames cfg.systemd.services;
                homeServices = builtins.attrNames hm.systemd.user.services;
                containers = builtins.attrNames cfg.containers;
                serviceDefinitions = builtins.attrNames cfg.modules.services.definitions;
                flags = {
                  fish = hm.programs.fish.enable or false;
                  t3code = hm.programs.t3code.enable or false;
                  steam = cfg.programs.steam.enable or false;
                  moonshine = cfg.services.moonshine.enable or false;
                  keyring = cfg.services.gnome.gnome-keyring.enable or false;
                  uinput = cfg.hardware.uinput.enable or false;
                };
              };
          in builtins.listToAttrs (map (host: { name = host; value = hostSnapshot host; }) [
            "alpha" "pi" "epsilon"
          ])
          NIX
          )
          FLEET_SNAPSHOT_ROOT="$before" nix eval --json --impure --expr "$snapshot" > "$RUNNER_TEMP/den-before.json"
          FLEET_SNAPSHOT_ROOT="$GITHUB_WORKSPACE" nix eval --json --impure --expr "$snapshot" > "$RUNNER_TEMP/den-after.json"
          if ! diff -u <(jq -S . "$RUNNER_TEMP/den-before.json") <(jq -S . "$RUNNER_TEMP/den-after.json"); then
            echo 'Den v0.20 changed evaluated host or Home Manager settings; review the diff before merging.' >&2
            exit 1
          fi
          echo 'Den host and Home Manager semantic snapshots are identical.'

      - name: Upload evaluation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-eval-fleet
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14


  persistence-vm:
    needs: changes
    if: needs.changes.outputs.run_persistence_vm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify requested revision
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          kvm: true
      # Same daemon contract as the checks job: uploads ride the post-build
      # hook, so VM-closure builds land in the fleet cache without re-uploading
      # substituted paths, and cache outages cannot fail the build.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          useDaemon: true
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Exercise persistence in disposable VMs
        env:
          CI_CHECKS: host-persistence-vm
        run: bash .github/scripts/run-checks.sh
      - name: Upload VM logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persistence-vm
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14

  upstream-package-build:
    name: upstream-package (${{ matrix.architecture }}, native)
    # The automation/atomic-cleanup sentinel resolves inside the job: every
    # atomic PR's required gate includes its bundled package validations.
    if: inputs.upstream_watcher != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((contains(inputs.upstream_watcher, 't3code-split') || inputs.upstream_watcher == 'automation/atomic-cleanup') && '[{"architecture":"x86","runner":"ubuntu-24.04"},{"architecture":"arm","runner":"ubuntu-24.04-arm"}]' || '[{"architecture":"x86","runner":"ubuntu-24.04"}]') }}
    steps:
      - name: Verify requested revision
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Native x86 and ARM builds feed the fleet cache; aarch64 hosts and the
      # ARM validator reuse these outputs on later watcher validations.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          useDaemon: true
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Verify actual upstream package and generated behavior
        env:
          WATCHERS: ${{ inputs.upstream_watcher }}
          ARCHITECTURE: ${{ matrix.architecture }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A dispatch may bundle several apply-coupled cleanups; validate
          # each in turn. Branch-triggered runs carry a single watcher name.
          # Atomic-cleanup PRs carry the sentinel instead: the bundled
          # watchers resolve from the exact candidate commit message, so
          # the required gate includes every bundled package validation.

          list="$WATCHERS"
          if [ "$list" = automation/atomic-cleanup ]; then
            list=$(git log -1 --format=%s | sed -n 's/.*updated lock (\([^)]*\)).*/\1/p' | tr ',' ' ')
            if [ -z "$list" ]; then
              echo "Cannot infer atomic watchers from the candidate head." >&2
              exit 1
            fi

          else
            list="${list#automation/upstream-}"
          fi
          if [ -z "$(printf '%s' "$list" | tr -d ' ')" ]; then
            echo "Atomic candidate has no package-validated watchers; refusing to skip validation." >&2
            exit 1
          fi
          for watcher in $(printf '%s' "$list" | tr ',' ' '); do
            # Only the split CLI cleanup has an additional ARM validator.
            if [ "$ARCHITECTURE" = arm ] && [ "$watcher" != t3code-split ]; then
              continue
            fi
            python3 .github/scripts/upstream-validate.py "$watcher" --architecture "$ARCHITECTURE"
          done

  hermes-package-build:
    # Build Epsilon's selected, patched messaging derivation, not an upstream
    # package or stubbed NixOS toplevel. Epsilon is native aarch64-linux.
    if: inputs.hermes_update
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Verify requested revision
        if: inputs.expected_sha != ''
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: test "$GITHUB_SHA" = "$EXPECTED_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: ${{ github.actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
          useDaemon: true
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build fleet-selected Hermes runtime
        run: |
          nix build --no-link --print-build-logs --no-update-lock-file \
            '.#nixosConfigurations.epsilon.config.containers.hermes.config.services.hermes-agent.package'

  gate:
    if: always()
    needs: [changes, checks, host-eval, persistence-vm, upstream-package-build, hermes-package-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation group
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          HOSTS_ENABLED: ${{ needs.changes.outputs.run_hosts }}
          PERSISTENCE_ENABLED: ${{ needs.changes.outputs.run_persistence_vm }}
          HOSTS_RESULT: ${{ needs.host-eval.result }}
          PERSISTENCE_RESULT: ${{ needs.persistence-vm.result }}
          UPSTREAM_WATCHER: ${{ inputs.upstream_watcher }}
          UPSTREAM_RESULT: ${{ needs.upstream-package-build.result }}
          HERMES_UPDATE: ${{ inputs.hermes_update }}
          HERMES_RESULT: ${{ needs.hermes-package-build.result }}
        run: |
          test "$CHANGES_RESULT" = success || exit 1
          test "$CHECKS_RESULT" = success || exit 1
          case "$HOSTS_ENABLED" in
            true) test "$HOSTS_RESULT" = success || exit 1 ;;
            false) test "$HOSTS_RESULT" = skipped || exit 1 ;;
            *) exit 1 ;;
          esac
          case "$PERSISTENCE_ENABLED" in
            true) test "$PERSISTENCE_RESULT" = success || exit 1 ;;
            false) test "$PERSISTENCE_RESULT" = skipped || exit 1 ;;
            *) exit 1 ;;
          esac
          if test "$HERMES_UPDATE" = true; then
            test "$HERMES_RESULT" = success || exit 1
          else
            test "$HERMES_RESULT" = skipped || exit 1
          fi
          if test -n "$UPSTREAM_WATCHER"; then
            test "$UPSTREAM_RESULT" = success
          else
            test "$UPSTREAM_RESULT" = skipped
          fi
