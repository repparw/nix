# The regular PR gate evaluates fleet derivations but does not build Voxtype.
# Build the selected Alpha package natively to catch missing Vulkan shaders.
name: voxtype-native-build
on:
  pull_request:
    paths:
      - 'modules/_packages/voxtype-vulkan-gguf.nix'
      - '.github/workflows/voxtype-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voxtype:
    name: Voxtype Vulkan + GGUF worker (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: true
      - name: Build Alpha's actual Voxtype derivation
        run: |
          nix build --impure --cores 2 --max-jobs 1 --no-link \
            --print-build-logs --no-update-lock-file --expr '
              let
                flake = builtins.getFlake (toString ./.);
              in
              flake.nixosConfigurations.alpha.pkgs.callPackage ./modules/_packages/voxtype-vulkan-gguf.nix { }
            '
