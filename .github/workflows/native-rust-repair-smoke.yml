# One-time validation for Codex before retiring the pinned Nixpkgs workaround.
# x86 Codex and Voxtype CPU+ONNX already passed native builds on this PR.
name: native-rust-repair-smoke
on:
  pull_request:
    paths:
      - modules/aspects/nixpkgs.nix
      - modules/aspects/ai/dictation.nix
      - .github/workflows/native-rust-repair-smoke.yml

permissions:
  contents: read

jobs:
  native-build:
    name: codex (aarch64-linux)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: true
      - name: Build Codex natively on ARM
        run: nix build --cores 1 --max-jobs 1 --no-link --print-build-logs --no-update-lock-file .#nixosConfigurations.epsilon.pkgs.codex

  ashell-x86_64:
    # Alpha is x86_64 and cannot be validated from the aarch64 fleet hosts.
    name: ashell (x86_64-linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: true
      - name: Build ashell natively on x86_64
        run: nix build --cores 1 --max-jobs 1 --no-link --print-build-logs --no-update-lock-file .#nixosConfigurations.alpha.pkgs.ashell
