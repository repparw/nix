name: native-rust-repair-smoke
on:
  pull_request:
    paths:
      - modules/aspects/nixpkgs.nix
      - modules/aspects/ai/dictation.nix
      - .github/workflows/native-rust-repair-smoke.yml

permissions:
  contents: read

jobs:
  native-build:
    name: ${{ matrix.package }} (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: codex
            system: x86_64-linux
            runner: ubuntu-24.04
            attribute: nixosConfigurations.alpha.pkgs.codex
          - package: codex
            system: aarch64-linux
            runner: ubuntu-24.04-arm
            attribute: nixosConfigurations.epsilon.pkgs.codex
          - package: voxtype
            system: x86_64-linux
            runner: ubuntu-24.04
            attribute: nixosConfigurations.alpha.config.home-manager.users.repparw.services.voxtype.package
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: repparw
          skipPush: true
      - name: Build selected native package
        env:
          ATTRIBUTE: ${{ matrix.attribute }}
        run: nix build --no-link --print-build-logs --no-update-lock-file ".#$ATTRIBUTE"
