# Temporary cross-revision semantic checks for explicit routing and inventory refactors.
# Remove from the final consolidated PR after passing checks.
name: den-followup-equivalence
on:
  pull_request:
    paths:
      - 'modules/**'
      - '.github/scripts/den-followup-snapshot.nix'
      - '.github/workflows/den-followup-equivalence.yml'
      - '.github/upstream/cleanup/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Frozen baseline: the pre-refactor main revision, not the stacked PR base.
          ref: 1d4fd29f9338775925bcfa91d8a1b352b861d2aa
          path: baseline
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Compare evaluated user, desktop and service configuration
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$GITHUB_WORKSPACE/candidate/.github/scripts/den-followup-snapshot.nix"
          nix eval --impure --json --show-trace --expr "(import $snapshot) { flakePath = \"$GITHUB_WORKSPACE/baseline\"; }" | jq -S . > baseline.json
          nix eval --impure --json --show-trace --expr "(import $snapshot) { flakePath = \"$GITHUB_WORKSPACE/candidate\"; }" | jq -S . > candidate.json
          if ! diff -u baseline.json candidate.json; then
            echo "::error::Den role refactor changed evaluated semantics; inspect the diff above"
            exit 1
          fi
          echo "Evaluated snapshots match for alpha, pi and epsilon"
